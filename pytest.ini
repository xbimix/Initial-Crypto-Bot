[pytest]
testpaths = crypto_bot/tests
norecursedirs =
    .git
    .venv
    .next
    node_modules
    crypto_bot/state
    crypto_bot/state/baseline
    crypto_bot/pytest-cache-files-*
    crypto_bot/**/pytest-cache-files-*
    crypto_bot/**/.pytest_cache
    crypto_bot/**/pytest_base_env
    crypto_bot/**/tmp*
addopts = -ra
