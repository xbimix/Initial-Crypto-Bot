name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto_bot/requirements.txt -r crypto_bot/requirements-dev.txt

      - name: Behavior lock hash check
        shell: pwsh
        run: |
          ./scripts/check_behavior_lock_contract.ps1
          ./scripts/check_strategy_hashes.ps1

      - name: Compile Python
        run: |
          python -m compileall -q \
            crypto_bot/analysis \
            crypto_bot/api \
            crypto_bot/config \
            crypto_bot/control \
            crypto_bot/data \
            crypto_bot/domain \
            crypto_bot/paper \
            crypto_bot/reporting \
            crypto_bot/risk \
            crypto_bot/strategy \
            crypto_bot/trading \
            crypto_bot/ui \
            crypto_bot/utils

      - name: Run Python tests
        env:
          REVBOT_CONFIG_STRICT: "1"
        run: |
          python -m pytest crypto_bot/tests -q -p no:cacheprovider

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Wave-zone test
        run: npm run test:wave-zones

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
